[project]
name = "autoapply-engine"
version = "0.1.0"
description = "Vision & CDP-powered autonomous job application engine using browser-use"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "browser-use>=0.1.40",
    "cdp-use>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
]

[tool.uv]
package = false

[tool.uv.sources]
browser-use = { path = "../../browser-use", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
